# Production compose for BeamTerminal.
# Deploy path: /root/Beam/BeamTerminal
#
# explorer-node runs on the host (systemd unit) on 127.0.0.1:8888.
# nginx runs on the host (not in compose), see ../nginx.conf.
#
# Both indexer and api use host network mode so they can reach
# - explorer-node on 127.0.0.1:8888
# - postgres on 127.0.0.1:5432 (postgres publishes to loopback only)
#
# Container logs are capped (json-file, 50m × 3) so an unbounded log can't fill
# the host disk — the box is shared with other docker stacks. This mirrors the
# global default in /etc/docker/daemon.json; keeping it here too means our
# services are bounded on the next `up` even before a daemon restart applies the
# global default.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: beamterminal
      POSTGRES_USER: beamterminal
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets: [postgres_password]
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beamterminal -d beamterminal"]
      interval: 5s
      timeout: 3s
      retries: 20

  indexer:
    build: ./backend
    command: node dist/src/indexer.js
    restart: always
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: host
    env_file: ./backend/.env

  api:
    build: ./backend
    command: node dist/src/api.js
    restart: always
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: host
    env_file: ./backend/.env

  # BEAM wallet-api 7.5.13882. Used by:
  #   - the DApp Store projection (invoke_contract of dapps_store_app.wasm)
  #   - the IPFS archival mirror + gateway (ipfs_pin / ipfs_get)
  # Asset swaps no longer go through here — they come from the explorer's
  # /asset_swaps endpoint (BeamMW/beam #2054).
  # Connects P2P to the host-local explorer-node on 127.0.0.1:10000.
  # First boot generates wallet.db + seed.txt in the named volume; the wallet
  # holds no funds, it is read-only gossip + RPC. Required env in
  # backend/.env: WALLET_API_NODE_ADDR, WALLET_API_PASS, WALLET_API_PORT,
  # WALLET_API_HTTP, WALLET_API_IP_WHITELIST.
  wallet-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.wallet-api
    restart: always
    logging: *default-logging
    network_mode: host
    env_file: ./backend/.env
    volumes:
      - wallet-api-data:/data

volumes:
  postgres-data:
  wallet-api-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
